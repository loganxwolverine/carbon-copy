# Construit les paquets natifs dans un conteneur de chaque distribution,
# puis les publie dans la Release GitHub correspondant au tag (v0.1.0…).
name: Paquets

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu-24.04, image: 'ubuntu:24.04', prep: 'apt-get update -q && apt-get install -yq tar gzip' }
          - { distro: debian-13, image: 'debian:13', prep: 'apt-get update -q && apt-get install -yq tar gzip' }
          - { distro: fedora-44, image: 'fedora:44', prep: 'dnf install -y tar gzip' }
          - { distro: opensuse-tumbleweed, image: 'opensuse/tumbleweed', prep: 'zypper --non-interactive install tar gzip' }
          # Arch en attente : paquet à valider avant publication (voir ROADMAP).
          # - { distro: arch, image: 'archlinux:latest', prep: 'pacman -Sy --noconfirm tar gzip' }
    steps:
      - name: Outils de base
        run: ${{ matrix.prep }}
      - uses: actions/checkout@v4
      - name: Construction du paquet
        run: bash packaging/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.distro }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publication dans la Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Intact Bitstream $TAG" --notes "Paquets natifs pour Ubuntu, Debian, Fedora et openSUSE."
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
