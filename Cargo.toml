[package]
name = "intact-bitstream"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Interface GTK4/libadwaita automatisée pour MakeMKV (makemkvcon)"
license = "GPL-3.0-or-later"

[dependencies]
# Interface graphique native GNOME.
# Fonctionnalités minimales : GTK 4.14 / libadwaita 1.5 (Fedora 40+).
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }

# Asynchronisme : processus enfants, timers, annulation.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "io-util", "time", "fs", "sync", "macros"] }
tokio-util = "0.7.20"
async-channel = "2.5.0"

# Réseau (clé bêta, TMDB, version MakeMKV) — TLS via rustls, aucune dépendance OpenSSL.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "http2", "charset", "system-proxy"] }

# Télécommande web (serveur HTTP local).
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }

# Parsing / sérialisation.
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
deunicode = "1.6.2"

# Divers.
anyhow = "1.0.104"
libc = "0.2.191"

[profile.release]
lto = "thin"
strip = true
